[package]
name = "dash"
version = "0.4.2"
description = "Dash — quick-capture to-do app"
authors = ["gaggi32"]
edition = "2021"
rust-version = "1.77.2"

# The library is what `main.rs` (and mobile entry points) call into.
[lib]
name = "dash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Opens the one fixed releases page; the UI never names a URL.
tauri-plugin-opener = "2"
# Update check against GitHub releases (version number only).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
